<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AU Checklist</title>
<link rel="icon" type="image/png" href="MOMO.png">
<link rel="apple-touch-icon" href="MOMO.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#F3F3F2; --card:#FFFFFF; --text:#262524; --body:#474544;
  --sub:#9C9997; --faint:#CFCCCA; --line:#ECEBEA; --soft:#F7F6F5;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  padding:36px 14px 96px;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}

.p1{--pc:var(--c1);--pt:var(--c1t)}
.p2{--pc:var(--c2);--pt:var(--c2t)}

/* ---------- sheet ---------- */
.wrap{max-width:720px;margin:0 auto}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px -26px rgba(0,0,0,.22)}
.strip{height:3px;background:linear-gradient(90deg,var(--c1),var(--c2))}

/* ---------- hero ---------- */
.hero{padding:26px 32px 22px;border-bottom:1px solid var(--line);transition:background .4s}
.hd{text-align:center}
.hd-e{display:block;font-size:10.5px;letter-spacing:.42em;padding-left:.42em;color:var(--sub)}
.hd-t{
  display:inline-block;margin-top:2px;padding:0 .14em;
  font-family:'Allura',cursive;font-weight:400;font-size:48px;line-height:1.15;
  color:var(--accent);
  background:linear-gradient(90deg,var(--t1),var(--t2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

.people{display:grid;grid-template-columns:1fr 104px 1fr;margin-top:20px;align-items:start}
.person{display:flex;flex-direction:column;align-items:center;min-width:0}

.av-wrap{position:relative;display:inline-block;padding:3px;border-radius:50%;border:2px solid var(--pc);background:var(--card)}
.avatar{position:relative;width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--pc);transition:background .3s}
.av-init{position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;cursor:pointer}
.av-img{position:absolute;top:0;left:0;right:0;bottom:0;display:none;touch-action:none;cursor:grab;overflow:hidden;border-radius:50%}
.av-img:active{cursor:grabbing}
.av-img img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none}
.av-edit{position:absolute;right:-2px;bottom:-2px;z-index:3;width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .15s}
.av-edit:hover{color:var(--text)}
.av-edit svg{width:10px;height:10px}

.name{display:block;width:100%;max-width:150px;margin-top:12px;border:none;outline:none;background:transparent;text-align:center;font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.3;padding:2px 0 6px;border-bottom:1px solid var(--line);transition:border-color .2s}
.name::placeholder{color:var(--faint);font-weight:500}
.name:focus{border-bottom-color:var(--pc)}
.type{margin-top:8px;max-width:230px;text-align:center;font-size:11.5px;font-weight:600;color:var(--pt);letter-spacing:-.01em;line-height:1.45;min-height:16px;word-break:keep-all}
.type.empty{color:var(--faint);font-weight:400}
.type.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* traits: three opposing axes */
.traits{width:100%;max-width:226px;margin-top:10px}
.ax{display:flex;align-items:center;gap:5px;height:19px}
.ax .tr{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.tr-l{font-size:10.5px;color:var(--sub);white-space:nowrap;width:22px}
.ax .r .tr-l{text-align:right}
.tr-v{font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums;width:26px}
.ax .r .tr-v{text-align:right}
.tr-bar{flex:1;height:3px;background:var(--line);position:relative;overflow:hidden}
.ax .l .tr-bar{border-radius:9px 0 0 9px}
.ax .r .tr-bar{border-radius:0 9px 9px 0}
.tr-fill{position:absolute;top:0;bottom:0;width:0;background:var(--pc);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ax .l .tr-fill{right:0}
.ax .r .tr-fill{left:0}
.ax .tr:not(.best) .tr-fill{opacity:.4}
.tr.best .tr-l{color:var(--text);font-weight:600}
.tr.best .tr-v{color:var(--pt);font-weight:600}

.mid{display:flex;flex-direction:column;align-items:center;padding-top:34px}
.x{font-size:18px;font-weight:300;line-height:1;color:var(--faint)}

/* ---------- universe picker (screen only) ---------- */
.picker{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:14px 20px;border-bottom:1px solid var(--line)}
.pk{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--sub);transition:color .15s,border-color .15s,background .15s}
.pk.on{border-color:var(--text);color:var(--text);font-weight:600}

/* ---------- list ---------- */
.list{padding:4px 30px 22px}
.au{margin-top:22px}
.au+.au{margin-top:30px}
.au-h{display:flex;align-items:baseline;gap:10px;margin:0 8px 2px}
.au-t{font-family:'Allura',cursive;font-size:28px;line-height:1.1;color:var(--accent);white-space:nowrap}
.au-s{font-size:10.5px;color:var(--sub);letter-spacing:.06em;white-space:nowrap}
.cat{margin-top:12px}
.cat-h{display:flex;align-items:center;gap:12px;margin:0 8px 6px}
.cat-t{font-size:10.5px;font-weight:600;letter-spacing:.24em;color:var(--accent);white-space:nowrap}
.cat-line{flex:1;height:1px;background:var(--line)}
.rows{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.item{display:flex;align-items:center;gap:8px;min-height:31px;padding:4px 8px;border-radius:8px;transition:background .2s}
.item-t{flex:1;font-size:12.5px;color:var(--body);line-height:1.4;word-break:keep-all}
.item.any .item-t{color:var(--text)}
.cks{display:flex;gap:6px}
.chk{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--pc);opacity:.75;transition:background .15s,opacity .15s,transform .12s}
.chk.c1{--pc:var(--c1)}
.chk.c2{--pc:var(--c2)}
.chk.on{background:var(--pc);opacity:1}
.chk.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.empty-msg{text-align:center;color:var(--sub);font-size:12.5px;padding:40px 0 20px}
@media (hover:hover){
  .item:hover{background:var(--soft)}
  .chk:hover{opacity:1}
  .pk:hover{color:var(--text)}
}

.foot{padding:12px 20px 14px;border-top:1px dashed var(--line);text-align:center;font-size:9.5px;letter-spacing:.32em;text-indent:.32em;color:var(--faint)}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:2px;padding:4px;border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.06);box-shadow:0 8px 28px -10px rgba(0,0,0,.22)}
.d-btn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:500;color:#4a4648;white-space:nowrap;transition:background .15s,color .15s}
.d-btn svg{width:15px;height:15px;flex-shrink:0}
.d-btn.active{background:#F1EEEF;color:#1f1b1c}
.d-btn.primary{background:#1f1b1c;color:#fff;padding:0 14px;margin-left:2px}
.d-btn:disabled{opacity:.55;cursor:default}
@media (hover:hover){
  .d-btn:hover{background:#F4F2F2;color:#1f1b1c}
  .d-btn.primary:hover{background:#000;color:#fff}
}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-6px);opacity:0;pointer-events:none;padding:8px 14px;border-radius:10px;background:rgba(31,27,28,.92);color:#fff;font-size:12px;transition:opacity .2s,transform .2s;z-index:101;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- color panel ---------- */
.panel{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));z-index:99;width:min(320px,calc(100vw - 24px));padding:12px 14px 14px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.06);box-shadow:0 16px 40px -14px rgba(0,0,0,.25);transform:translate(-50%,6px);opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s}
.panel.open{opacity:1;visibility:visible;transform:translate(-50%,0)}
.pn-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12.5px;font-weight:600;color:#1f1b1c}
.pn-x{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#9a9496}
.pn-x svg{width:14px;height:14px}
.pn-sec+.pn-sec{margin-top:12px}
.pn-k{font-size:11px;font-weight:500;color:#8f898b;margin-bottom:7px}
.pn-h{color:#b9b3b5;margin-left:3px}
.pn-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw,.gc,.gci{position:relative;width:20px;height:20px;border-radius:50%;cursor:pointer}
.gc{border:1px solid rgba(0,0,0,.08)}
.sw.on::after,.gc.on::after,.gci.on::after{content:'';position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border-radius:50%;border:1.5px solid #1f1b1c}
.gc-none{background:linear-gradient(135deg,transparent 45%,#9a9496 45%,#9a9496 55%,transparent 55%),#fff}
.gci{border:1px dashed #b9b3b5}
.gci input{position:absolute;top:-8px;left:-8px;width:40px;height:40px;opacity:0;cursor:pointer;border:none}
.gci-in{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:50%;overflow:hidden}
.gcustom{display:flex;align-items:center;gap:6px;margin-left:2px;padding-left:9px;border-left:1px solid #EEE9EA}
@media (hover:hover){.pn-x:hover{background:#F4F2F2;color:#1f1b1c}}

/* ---------- mobile ---------- */
@media (max-width:600px){
  body{padding:12px 8px 90px}
  .sheet{border-radius:16px}
  .hero{padding:22px 12px 18px}
  .hd-t{font-size:41px}
  .people{grid-template-columns:1fr 40px 1fr;margin-top:16px}
  .name{font-size:16px}
  .tr-v{display:none}
  .tr-l{font-size:10px;width:20px}
  .picker{padding:12px 10px}
  .list{padding:0 8px 16px}
  .rows{grid-template-columns:1fr}
  .item{min-height:40px}
  .item-t{font-size:13.5px}
  .chk{width:22px;height:22px}
  .d-btn{padding:0 10px}
}

/* ---------- capture (applied to the clone only) ---------- */
.capturing *,.capturing *::before,.capturing *::after{animation:none!important;transition:none!important}
body.capturing{padding:0;background:transparent}
.capturing #capture{width:720px;padding:0;background:transparent}
.capturing .sheet{box-shadow:none}
.capturing .hero{padding:26px 32px 22px}
.capturing .hd-t{font-size:48px}
.capturing .people{grid-template-columns:1fr 104px 1fr;margin-top:20px}
.capturing .name{font-size:15px}
.capturing .tr-v{display:block}
.capturing .tr-l{font-size:10.5px;width:22px}
.capturing .list{padding:4px 30px 22px}
.capturing .rows{grid-template-columns:1fr 1fr}
.capturing .item{min-height:31px}
.capturing .item-t{font-size:12.5px}
.capturing .chk{width:15px;height:15px}
</style>
</head>
<body>

<main class="wrap">
  <div id="capture">
    <article class="sheet">
      <div class="strip"></div>
      <div class="hero">
        <header class="hd"><span class="hd-e">ANOTHER UNIVERSE</span><h1 class="hd-t">AU Checklist</h1></header>
        <section class="people">
          <div class="person p1" id="person1"></div>
          <div class="mid"><span class="x">×</span></div>
          <div class="person p2" id="person2"></div>
        </section>
      </div>
      <nav class="picker no-cap" id="picker" aria-label="유니버스 선택"></nav>
      <section class="list" id="list"></section>
      <footer class="foot">ACROSS ALL UNIVERSES</footer>
    </article>
  </div>
</main>

<div class="panel no-cap" id="panel" aria-hidden="true">
  <div class="pn-head"><span>컬러</span><button class="pn-x" id="pnClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="pn-sec"><p class="pn-k" id="pk1">A 컬러</p><div class="pn-row" id="sw1"></div></div>
  <div class="pn-sec"><p class="pn-k" id="pk2">B 컬러</p><div class="pn-row" id="sw2"></div></div>
  <div class="pn-sec"><p class="pn-k">배경 <span class="pn-h" id="gname"></span></p><div class="pn-row" id="pg"></div></div>
</div>

<nav class="dock no-cap">
  <button class="d-btn" id="colorBtn" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>컬러</button>
  <button class="d-btn" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>초기화</button>
  <button class="d-btn primary" id="saveBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span id="saveLabel">이미지 저장</span></button>
</nav>
<div class="toast no-cap" id="toast" role="status"></div>

<script>
/* ================= data ================= */
// three opposing axes
const TRAITS={d:'헌신',s:'자립',r:'이성',b:'본능',o:'표현',h:'억제'};
const TK=Object.keys(TRAITS);
const AXES=[['d','s'],['r','b'],['o','h']];

/* Each item: [text, tags]. Tags are axis keys separated by spaces,
   or '@역할' for a role item (shown in front of the type label).
   Item ids come from the universe id + position, so append new items at the end of a category.
   To remove an item, set its tags to null instead of deleting the line. */
const AUS=[
  {id:'sentinel',label:'센티넬버스',title:'Sentinel·verse',cats:[
    {title:'기본 설정',items:[
      ['센티넬인 사람','@센티넬'],['가이드인 사람','@가이드'],
    ]},
    {title:'가이딩',items:[
      ['파트너 외에도 가이딩받을 수 있는 사람','s'],
      ['파트너 외에도 가이딩해줄 수 있는 사람','s r'],
      ['파트너가 타인에게 가이딩받는 걸 볼 수 있는 사람','r'],
      ['파트너가 타인을 가이딩해주는 걸 볼 수 있는 사람','r'],
      ['감각이 폭주해도 혼자 버티려는 사람','s h'],
      ['상대의 냄새·목소리로 안정을 찾는 사람','b'],
    ]},
    {title:'파트너십',items:[
      ['임시라고 우기면서 계속 있어준 사람','d h'],
      ['파트너 앞에서만 무너진 사람','d h'],
      ['타 센티넬의 임시 가이딩 요청을 거절한 사람','d'],
      ['가이드 없이 나갔다가 반쯤 죽어 돌아온 사람','s b'],
      ['파트너의 위기를 느끼고 임무 중 이탈한 사람','d b'],
      ['상대의 감정을 읽고 먼저 다가가는 사람','d o'],
      ['각인을 먼저 제안한 사람','o'],
      ['각인을 끝까지 미루는 사람','s'],
    ]},
    {title:'임무',items:[
      ['상대를 두고 혼자 임무 나갈 수 없는 사람','d'],
      ['혼자 떠나는 상대를 보내줄 수 있는 사람','s r'],
      ['파트너가 다쳐도 임무를 계속할 수 있는 사람','r s'],
      ['센터의 명령보다 파트너를 우선하는 사람','d b'],
    ]},
  ]},
  {id:'zombie',label:'좀비 아포칼립스',title:'Zombie·verse',cats:[
    {title:'생존 스타일',items:[
      ['단독 행동을 선호하는 사람','s'],
      ['낯선 사람도 일단 믿어보는 사람','o'],
      ['낯선 사람은 일단 경계하는 사람','h r'],
      ['안전지대를 찾아 정착하고 싶은 사람','r'],
      ['계속 이동하며 살아남으려는 사람','b'],
      ['리더 역할을 맡게 되는 사람','r'],
      ['무리를 이끌기보다 둘이서만 다니고 싶은 사람','d s'],
      ['생존자 무리를 쉽게 믿지 않는 사람','r h'],
    ]},
    {title:'생존 감각',items:[
      ['잠든 중에도 위험을 감지하는 사람','b'],
      ['식량보다 무기를 먼저 챙기는 사람','b'],
      ['상대가 잠든 사이 혼자 보초를 서는 사람','d'],
    ]},
    {title:'결단',items:[
      ['감염 여부를 숨길 수 있는 사람','h'],
      ['타인을 죄책감 없이 희생시킬 수 있는 사람','r s'],
      ['감염된 상대를 직접 처리할 수 있는 사람','r'],
      ['상대가 물렸을 때 도망가지 않는 사람','d'],
      ['멘탈이 먼저 무너지는 사람','o'],
      ['절대 포기하지 않는 사람','d'],
      ['마지막 순간 상대를 지키고 죽는 사람','d'],
      ['감염자가 된 가족·친구를 쏘지 못한 사람','b'],
    ]},
  ]},
  {id:'omega',label:'오메가버스',title:'Omega·verse',cats:[
    {title:'2차 성별',items:[
      ['알파인 사람','@알파'],['베타인 사람','@베타'],['오메가인 사람','@오메가'],
    ]},
    {title:'본능 & 억제',items:[
      ['페로몬 억제제를 사용하는 사람','h r'],
      ['본능을 이성으로 억제하는 사람','r h'],
      ['지배 본능이 강한 사람','b'],
      ['보호받는 것에 안도감을 느끼는 사람','d'],
      ['상대의 페로몬에 영향받기 싫은 사람','s'],

  grad:{mode:'auto'},

});
function isHex(v){return typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v)}

try{
  const saved=JSON.parse(localStorage.getItem(KEY)||'null');

      names:Array.isArray(saved.names)?saved.names.slice(0,2).map(v=>String(v||'')):d.names,
      colors:Array.isArray(saved.colors)&&saved.colors.every(isHex)?saved.colors.slice(0,2):d.colors,
      checks:saved.checks&&typeof saved.checks==='object'?saved.checks:{},
      photos:Array.isArray(saved.photos)?saved.photos.slice(0,2):d.photos,
      ph:Array.isArray(saved.ph)?saved.ph.slice(0,2).map(v=>({s:+v?.s||1,x:+v?.x||0,y:+v?.y||0})):d.ph,
      grad:saved.grad&&saved.grad.mode?saved.grad:d.grad,
      aus:{...d.aus,...(saved.aus&&typeof saved.aus==='object'?saved.aus:{})},
    };
    const ids=new Set(AUS.flatMap(itemsOf).map(it=>it.id));
    Object.keys(state.checks).forEach(k=>{if(!ids.has(k))delete state.checks[k]});
  }
}catch(e){state=DEFAULT()}
function persist(){

function shade(hex,f){const n=parseInt(hex.slice(1),16);const c=v=>Math.round(Math.min(255,v*f)).toString(16).padStart(2,'0');return '#'+c(n>>16&255)+c(n>>8&255)+c(n&255)}

/* ================= photo ================= */
const dims=[null,null];
function loadPhoto(p,file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    const im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,600/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      state.photos[p]=c.toDataURL('image/jpeg',.88);
      state.ph[p]={s:1,x:0,y:0};
      renderPhoto(p);persist();
      toast('드래그로 위치, 휠·핀치로 크기 조절');
    };
    im.onerror=()=>toast('사진을 불러오지 못했어요');
    im.src=e.target.result;
  };
  r.readAsDataURL(file);
  $('ph'+(p+1)).value='';
}
function renderPhoto(p){
  const n=p+1,url=state.photos[p];
  $('iw'+n).style.display=url?'block':'none';
  $('init'+n).style.display=url?'none':'flex';
  if(url)$('pi'+n).src=url;
}
function computeDims(p){
  const img=$('pi'+(p+1)),nw=img.naturalWidth,nh=img.naturalHeight;if(!nw)return;
  const r=Math.max(AV/nw,AV/nh);dims[p]={w:nw*r,h:nh*r};
  img.style.width=dims[p].w+'px';img.style.height=dims[p].h+'px';
}
function clampPan(p){
  const ph=state.ph[p],d=dims[p];if(!d)return;
  ph.s=Math.min(5,Math.max(1,ph.s));
  const mx=Math.max(0,(d.w*ph.s-AV)/2),my=Math.max(0,(d.h*ph.s-AV)/2);
  ph.x=Math.min(mx,Math.max(-mx,ph.x));ph.y=Math.min(my,Math.max(-my,ph.y));
}
function applyPan(p){
  clampPan(p);const ph=state.ph[p];
  $('pi'+(p+1)).style.transform=`translate(-50%,-50%) translate(${ph.x}px,${ph.y}px) scale(${ph.s})`;
}
function setupPan(p){
  const w=$('iw'+(p+1));const pts=new Map();let lastD=0;
  const dist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
  w.addEventListener('pointerdown',e=>{e.preventDefault();w.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2)lastD=dist()});
  w.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    const prev=pts.get(e.pointerId),cur={x:e.clientX,y:e.clientY};pts.set(e.pointerId,cur);
    const ph=state.ph[p];
    if(pts.size===1){ph.x+=cur.x-prev.x;ph.y+=cur.y-prev.y}
    else if(pts.size===2){const d=dist();if(lastD)ph.s*=d/lastD;lastD=d}
    applyPan(p);
  });
  const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);lastD=pts.size===2?dist():0;persist()};
  w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
  w.addEventListener('wheel',e=>{e.preventDefault();state.ph[p].s*=e.deltaY<0?1.08:1/1.08;applyPan(p);persist()},{passive:false});
}
function avatarDataURL(p){
  const img=$('pi'+(p+1)),d=dims[p];
  if(!state.photos[p]||!img.naturalWidth||!d)return null;
  const R=6,C=AV*R,ph=state.ph[p];
  const c=document.createElement('canvas');c.width=c.height=C;
  const ctx=c.getContext('2d');
  ctx.beginPath();ctx.arc(C/2,C/2,C/2,0,Math.PI*2);ctx.clip();
  ctx.translate(C/2+ph.x*R,C/2+ph.y*R);ctx.scale(ph.s,ph.s);
  ctx.drawImage(img,-d.w*R/2,-d.h*R/2,d.w*R,d.h*R);
  return c.toDataURL('image/png');
}

/* ================= stats ================= */
const lastLabel=[null,null];
function updateStats(){
  const all=activeAUs().flatMap(itemsOf);
  [0,1].forEach(p=>{
    const n=p+1,vals={};
    TK.forEach(k=>{
      const pool=all.filter(it=>it.tr.includes(k));
      const v=pool.length?Math.round(pool.filter(it=>ck(it.id)[p]).length/pool.length*100):0;
      vals[k]=v;
      const el=$(`tr${n}-${k}`);
      el.querySelector('.tr-fill').style.width=v+'%';
      el.querySelector('.tr-v').textContent=v+'%';
    });
    const wins=AXES.map(([a,b])=>vals[a]>vals[b]?a:vals[b]>vals[a]?b:null).filter(Boolean);
    TK.forEach(k=>$(`tr${n}-${k}`).classList.toggle('best',wins.includes(k)));
    const roles=all.filter(it=>it.role&&ck(it.id)[p]).map(it=>it.role);
    const parts=[...roles,...wins.map(k=>TRAITS[k])];
    const label=parts.length?parts.join(' · '):'—';
    const bd=$('bd'+n);
    bd.classList.toggle('empty',!parts.length);
    if(lastLabel[p]!==null&&lastLabel[p]!==label){bd.classList.remove('fade');void bd.offsetWidth;bd.classList.add('fade')}
    bd.textContent=label;lastLabel[p]=label;
  });
}

/* ================= background gradient ================= */
function gradColors(){
  const g=state.grad;
  if(g.mode==='none')return null;
  if(g.mode==='pair'&&isHex(g.a)&&isHex(g.b))return [g.a,g.b];
  return state.colors;
}
function applyGrad(){
  const c=gradColors();
  document.querySelector('.hero').style.background=c?`linear-gradient(120deg,${rgba(c[0],.13)} 0%,${rgba(c[0],0)} 44%,${rgba(c[1],0)} 56%,${rgba(c[1],.13)} 100%)`:'transparent';
  const pg=$('pg');if(!pg.children.length)return;
  const g=state.grad;
  $('gAuto').style.background=`linear-gradient(135deg,${state.colors[0]},${state.colors[1]})`;
  pg.querySelectorAll('.gc').forEach(el=>{
    const k=el.dataset.k;
    el.classList.toggle('on',(g.mode==='auto'&&k==='auto')||(g.mode==='none'&&k==='none')||(g.mode==='pair'&&k===g.n));
  });
  const custom=g.mode==='pair'&&g.n==='custom';
  ['gcA','gcB'].forEach((id,i)=>{
    const inp=$(id),wrap=inp.parentNode;
    if(custom)inp.value=i?g.b:g.a;
    wrap.classList.toggle('on',custom);
    wrap.querySelector('.gci-in').style.background=custom?inp.value:'transparent';
  });
  $('gname').textContent=g.mode==='auto'?'자동':g.mode==='none'?'없음':custom?'직접 선택':g.n;
}
function setGrad(g){state.grad=g;applyGrad();persist()}
function buildGrad(){
  const w=$('pg');
  const chip=(k,bg,title,fn)=>{const d=document.createElement('button');d.className='gc';d.dataset.k=k;d.title=title;d.setAttribute('aria-label',title);if(bg)d.style.background=bg;d.onclick=fn;w.appendChild(d);return d};
  chip('auto','','자동 (두 사람 컬러)',()=>setGrad({mode:'auto'})).id='gAuto';
  GRADS.forEach(g=>chip(g.n,`linear-gradient(135deg,${g.a},${g.b})`,g.n,()=>setGrad({mode:'pair',n:g.n,a:g.a,b:g.b})));
  chip('none','','없음',()=>setGrad({mode:'none'})).classList.add('gc-none');
  const cu=document.createElement('div');cu.className='gcustom';
  cu.innerHTML=`<label class="gci" title="왼쪽 색"><span class="gci-in"></span><input type="color" id="gcA" value="#C9C6C3"></label><label class="gci" title="오른쪽 색"><span class="gci-in"></span><input type="color" id="gcB" value="#A7AEB6"></label>`;
  w.appendChild(cu);
  const upd=()=>setGrad({mode:'pair',n:'custom',a:$('gcA').value,b:$('gcB').value});
  $('gcA').addEventListener('input',upd);$('gcB').addEventListener('input',upd);
}

};

// html2canvas can't paint gradient-clipped text, so the title is drawn on its own canvas
function gradTitleImage(){
  const h=document.querySelector('.hd-t');
  const cs=getComputedStyle(h),r=h.getBoundingClientRect();
  const probe=document.createElement('span');
  probe.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
  h.appendChild(probe);const base=probe.getBoundingClientRect().top-r.top;probe.remove();
  const fs=parseFloat(cs.fontSize),k=TITLE_PX/fs;
  const W=r.width*k,H=r.height*k,S=3;if(!W||!H)return null;
  const c=document.createElement('canvas');c.width=Math.ceil(W*S);c.height=Math.ceil(H*S);
  const ctx=c.getContext('2d');ctx.scale(S,S);
  ctx.font=`${cs.fontStyle} ${cs.fontWeight} ${TITLE_PX}px ${cs.fontFamily}`;
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  const x0=parseFloat(cs.paddingLeft)*k,tw=ctx.measureText(h.textContent).width;
  const rs=getComputedStyle(document.documentElement);
  const g=ctx.createLinearGradient(x0,0,x0+tw,0);
  g.addColorStop(0,rs.getPropertyValue('--t1').trim());g.addColorStop(1,rs.getPropertyValue('--t2').trim());
  ctx.fillStyle=g;ctx.fillText(h.textContent,x0,base*k);
  return {url:c.toDataURL('image/png'),w:W,h:H};
}
async function deliver(canvas,filename){
  const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
  if(!blob)throw new Error('이미지를 만들지 못했어요');
  // phones: open the share sheet so the image can go straight to Photos
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare){
    const file=new File([blob],filename,{type:'image/png'});
    if(navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return 'shared'}
      catch(e){if(e&&e.name==='AbortError')return 'cancelled'}
    }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  return 'downloaded';
}
$('saveBtn').onclick=async()=>{
  if(typeof html2canvas==='undefined'){alert('저장 기능을 불러오는 중이에요. 잠시 후 다시 시도해 주세요.');return}
  const btn=$('saveBtn'),label=$('saveLabel');
  btn.disabled=true;label.textContent='저장 중…';setPanel(false);
  try{
    await document.fonts.ready;
    const avatars=[avatarDataURL(0),avatarDataURL(1)];
    const title=gradTitleImage();
    const canvas=await html2canvas(document.querySelector('.sheet'),{
      scale:3,useCORS:true,backgroundColor:null,logging:false,
      windowWidth:1200,scrollX:0,scrollY:-window.scrollY,
      ignoreElements:el=>el.classList&&el.classList.contains('no-cap'),
      onclone:doc=>{
        doc.body.classList.add('capturing');
        [0,1].forEach(p=>{
          const n=p+1;
          const inp=doc.getElementById('n'+n);
          if(inp){const d=doc.createElement('div');d.className='name';d.textContent=displayName(p);inp.replaceWith(d)}
          const iw=doc.getElementById('iw'+n);
          iw.innerHTML='';
          if(avatars[p]){
            const im=doc.createElement('img');im.src=avatars[p];
            im.style.cssText=`position:absolute;left:0;top:0;width:${AV}px;height:${AV}px;transform:none;display:block`;
            iw.appendChild(im);iw.style.display='block';
            doc.getElementById('init'+n).style.display='none';
          }else iw.style.display='none';
        });
        if(title){
          const h=doc.querySelector('.hd-t');
          h.style.background='none';h.style.color='transparent';h.style.webkitTextFillColor='transparent';h.style.position='relative';
          const im=doc.createElement('img');im.src=title.url;
          im.style.cssText=`position:absolute;left:0;top:0;width:${title.w}px;height:${title.h}px`;
          h.appendChild(im);
        }
      },
    });
    const safe=s=>s.replace(/[\\/:*?"<>|]/g,'');
    const res=await deliver(canvas,`au-checklist-${safe(displayName(0))}x${safe(displayName(1))}.png`);
    if(res==='downloaded')toast('이미지를 저장했어요');
  }catch(e){
    alert('저장에 실패했어요: '+(e&&e.message?e.message:e));
  }finally{
    btn.disabled=false;label.textContent='이미지 저장';
  }
};
